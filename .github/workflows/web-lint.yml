name: Web lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Align npm version
        run: npm install --global npm@11.6.1
      - name: Install dependencies
        run: npm install
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
