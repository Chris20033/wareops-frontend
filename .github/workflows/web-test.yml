name: Web tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Align npm version
        run: npm install --global npm@11.6.1
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
